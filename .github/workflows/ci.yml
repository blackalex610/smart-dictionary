name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Includes supabase/tests: every migration applied to PGlite and the
      # RLS / quota / tier rules checked against it.
      - name: Unit, integration and database tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: e2e (guest golden path + accessibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Runs against the production build under the production CSP
      # (vite.config.ts mirrors vercel.json's headers for `preview`), not the
      # dev server, so this also catches CSP regressions.
      - name: Guest golden path + WCAG 2 A/AA scan
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  edge-functions:
    name: edge functions (deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The React typecheck never sees the Deno code; a missing function or a
      # bad import here would otherwise only surface as a 500 in production.
      - name: Type-check ai-chat
        run: deno check supabase/functions/ai-chat/index.ts

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Production dependencies, high/critical only. Known and accepted:
      # react-router open redirect (moderate) — the app only navigates to fixed
      # routes, never to user- or AI-supplied URLs; the fix is the v7 major.
      # vite/esbuild advisories affect the local dev server only (devDeps).
      - name: npm audit (high+)
        run: npm audit --omit=dev --audit-level=high
