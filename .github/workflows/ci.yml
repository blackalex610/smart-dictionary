name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_dictionary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/smart_dictionary_test
      SUPABASE_URL: https://example-project.supabase.co
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy app

      # Migration drift + reversibility: a model and a migration disagreeing
      # is exactly the bug that produced `hasExampleColumn` in the pre-V2
      # frontend (words.ts:20) -- this is the direct answer to it, per
      # docs/architecture/v2-plan.md §L. Auth schema stub matches what
      # tests/integration/conftest.py sets up for pytest.
      - name: Migration round-trip and drift check
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d smart_dictionary_test -c "
            create extension if not exists pgcrypto;
            create schema if not exists auth;
            create table if not exists auth.users (id uuid primary key default gen_random_uuid(), email text);
            create or replace function auth.uid() returns uuid language sql stable as \$\$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid \$\$;
            do \$\$
            begin
              if not exists (select from pg_roles where rolname = 'anon') then
                create role anon nologin;
              end if;
              if not exists (select from pg_roles where rolname = 'authenticated') then
                create role authenticated nologin;
              end if;
              if not exists (select from pg_roles where rolname = 'service_role') then
                create role service_role nologin;
              end if;
            end
            \$\$;
          "
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
          alembic check

      # Unit + integration tests. Integration tests run against the
      # Postgres service container above (see tests/integration/conftest.py).
      - name: Tests
        run: pytest

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # High/critical only: the two known moderate CVEs (esbuild dev-server
      # request forgery, react-router open redirect) both require a major
      # version bump and are tracked separately rather than failing every PR.
      - name: npm audit (high+)
        run: npm audit --omit=dev --audit-level=high
